<script>
const events = [
    {year:1989,events:[
        {date:"12月13日",emoji:"🎂",title:"テイラー・スウィフト誕生",desc:"ペンシルベニア州ウェストレディングのクリスマスツリー農園で生まれる"},
    ]},
    {year:2004,events:[
        {date:"",emoji:"📝",title:"ソニーと作曲契約",desc:"14歳でソニー/ATVと作曲契約。史上最年少のプロ作曲家の一人に"},
    ]},
    {year:2005,events:[
        {date:"",emoji:"🎸",title:"Big Machine Recordsと契約",desc:"レーベル設立者スコット・ボルチェッタと契約。初のアーティストに"},
    ]},
    {year:2006,events:[
        {date:"10月24日",emoji:"🌟",title:"デビューアルバム『Taylor Swift』リリース",desc:"「Tim McGraw」「Teardrops on My Guitar」を収録。カントリーチャート1位"},

    {year:2008,events:[
        {date:"11月11日",emoji:"💛",title:"『Fearless』リリース",desc:"「Love Story」「You Belong with Me」で国民的スターに"},

    {year:2009,events:[
        {date:"2月",emoji:"🏆",title:"グラミー賞 アルバム・オブ・ザ・イヤー受賞",desc:"Fearlessで受賞。最年少記録（20歳）"},

    ]},
    {year:2010,events:[
        {date:"10月25日",emoji:"💜",title:"『Speak Now』リリース",desc:"全曲テイラー単独作詞の唯一のアルバム"},
    ]},
    {year:2012,events:[
        {date:"10月22日",emoji:"🧣",title:"『Red』リリース",desc:"ポップへの転向を示唆。「All Too Well」が名曲として語り継がれる"},
    ]},
    {year:2014,events:[
        {date:"10月27日",emoji:"🌊",title:"『1989』リリース",desc:"完全ポップ転向。「Shake It Off」「Blank Space」で世界を席巻"},
    ]},
    {year:2015,events:[
        {date:"2月",emoji:"🏆",title:"グラミー賞 3度目のアルバム・オブ・ザ・イヤー",desc:"1989で受賞。女性アーティスト初の2度受賞者に"},

    ]},
    {year:2017,events:[
        {date:"11月10日",emoji:"🐍",title:"『reputation』リリース",desc:"SNS炎上からの復活。「Look What You Made Me Do」で新時代宣言"},
    ]},
    {year:2019,events:[

    {year:2022,events:[

    ]},
    {year:2023,events:[

        {date:"10月27日",emoji:"🌊",title:"『1989 (Taylor\'s Version)』リリース",desc:"再録音第4弾。「Is It Over Now?」等Vault曲5曲"},
        {date:"12月6日",emoji:"🕐",title:"TIME パーソン・オブ・ザ・イヤー",desc:"音楽だけでなく文化的影響力で選出"},
    ]},
    {year:2024,events:[
        {date:"2月4日",emoji:"🏈",title:"スーパーボウル LVIII",desc:"トラヴィス・ケルシー出場のスーパーボウルにテイラーが来場。Chiefs勝利"},

        {date:"4月19日",emoji:"🪶",title:"『TTPD』リリース",desc:"初週260万枚。Billboard史上最大の初週セールス記録"},
        {date:"12月8日",emoji:"🎤",title:"Eras Tour 終幕",desc:"149公演、約1000万人動員。史上最高収益ツアー"},
    ]},
];

const tl = document.getElementById('timeline');
events.forEach(yearGroup => {
    tl.innerHTML += `<div class="tl-year"><span class="year-label">${yearGroup.year}</span></div>`;
    yearGroup.events.forEach(ev => {
        tl.innerHTML += `<div class="tl-event"><div class="event-card">
            ${ev.date ? `<div class="event-date">${ev.date}</div>` : ''}
            <div class="event-title">${ev.emoji} ${ev.title}</div>
            <div class="event-desc">${ev.desc}</div>
        </div></div>`;
    });
});
</script>
