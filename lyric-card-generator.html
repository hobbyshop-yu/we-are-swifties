    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: #0a0a0f;
            color: #e7e9ea;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        h1 {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #c9a0dc, #f5c2e7, #89b4fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align:center; color:#888; margin-bottom:2rem; font-size:0.9rem; }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .control-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .control-group.full { grid-column: 1 / -1; }
        label { font-size: 0.85rem; color: #aaa; font-weight: 500; }
        input, textarea, select {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 10px 14px;
            color: #e7e9ea;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: rgba(201,160,220,0.5);
        }
        textarea { resize: vertical; min-height: 60px; }
        select option { background: #1a1a2e; }
        
        .album-colors {
            display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px;
        }
        .color-chip {
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s;
        }
        .color-chip:hover, .color-chip.active {
            border-color: #fff; transform: scale(1.15);
        }
        
        .btn-generate {
            display: block; width: 100%; padding: 14px;
            background: linear-gradient(135deg, #c9a0dc, #89b4fa);
            border: none; border-radius: 10px; color: #0a0a0f;
            font-size: 1.05rem; font-weight: 700; cursor: pointer;
            transition: all 0.3s; font-family: inherit;
            margin-bottom: 2rem;
        }
        .btn-generate:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .preview-area {
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
        }
        
        /* The card itself */
        .lyric-card {
            width: 600px; height: 400px;
            border-radius: 16px; overflow: hidden;
            position: relative; display: flex;
            flex-direction: column; justify-content: center;
            align-items: center; text-align: center;
            padding: 3rem;
        }
        .lyric-card::before {
            content: ''; position: absolute; inset: 0;
            background: inherit; filter: brightness(0.3);
            z-index: 0;
        }
        .lyric-card .content { position: relative; z-index: 1; }
        .lyric-card .en-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem; font-style: italic;
            color: #fff; line-height: 1.5;
            margin-bottom: 1rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .lyric-card .ja-text {
            font-size: 1rem; color: rgba(255,255,255,0.8);
            line-height: 1.6;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }
        .lyric-card .song-title {
            position: absolute; bottom: 1.2rem; left: 0; right: 0;
            text-align: center; font-size: 0.8rem;
            color: rgba(255,255,255,0.5); z-index: 1;
        }
        .lyric-card .watermark {
            position: absolute; bottom: 1.2rem; right: 1.5rem;
            font-size: 0.65rem; color: rgba(255,255,255,0.25);
            z-index: 1; letter-spacing: 1px;
        }
        
        .btn-download {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 28px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px; color: #e7e9ea;
            text-decoration: none; font-size: 14px;
            cursor: pointer; transition: all 0.3s;
            font-family: inherit;
        }
        .btn-download:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-1px);
        }
        
        @media (max-width: 660px) {
            .controls { grid-template-columns: 1fr; }
            .lyric-card { width: 100%; height: auto; min-height: 300px; }
        }

    <div class="container">
        <h1>✨ Lyric Card Generator</h1>
        <p class="subtitle">SNS投稿用の歌詞カード画像を作成</p>
        
        <div class="controls">
            <div class="control-group full">
                <label>English Lyrics</label>
                <textarea id="enLyrics" placeholder="It's me, hi, I'm the problem, it's me">It's me, hi, I'm the problem, it's me</textarea>
            </div>
            <div class="control-group full">
                <label>日本語訳</label>
                <textarea id="jaLyrics" placeholder="私よ、こんにちは、問題は私なの">私よ、こんにちは、問題は私なの</textarea>
            </div>
            <div class="control-group">
                <label>曲名</label>
                <input id="songTitle" value="Anti-Hero — Taylor Swift" placeholder="Anti-Hero — Taylor Swift">
            </div>
            <div class="control-group">
                <label>アルバムテーマ</label>
                <div class="album-colors" id="albumColors">
                    <div class="color-chip active" data-bg="linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)" title="Midnights" style="background:linear-gradient(135deg,#1a1a2e,#0f3460)"></div>
                    <div class="color-chip" data-bg="linear-gradient(135deg, #2d1b3d 0%, #4a1942 50%, #1a1a2e 100%)" title="TTPD" style="background:linear-gradient(135deg,#2d1b3d,#1a1a2e)"></div>
                    <div class="color-chip" data-bg="linear-gradient(135deg, #4a1c1c 0%, #8b2020 50%, #2d0a0a 100%)" title="Red" style="background:linear-gradient(135deg,#4a1c1c,#2d0a0a)"></div>
                    <div class="color-chip" data-bg="linear-gradient(135deg, #1a3a4a 0%, #2d5a6a 50%, #0a2030 100%)" title="1989" style="background:linear-gradient(135deg,#1a3a4a,#0a2030)"></div>
                    <div class="color-chip" data-bg="linear-gradient(135deg, #3d2b1f 0%, #5a3a2a 50%, #1a1510 100%)" title="evermore" style="background:linear-gradient(135deg,#3d2b1f,#1a1510)"></div>
                    <div class="color-chip" data-bg="linear-gradient(135deg, #2a3a2a 0%, #1a2a1a 50%, #0a150a 100%)" title="folklore" style="background:linear-gradient(135deg,#2a3a2a,#0a150a)"></div>
                    <div class="color-chip" data-bg="linear-gradient(135deg, #3a2a1f 0%, #1a1a1a 50%, #0f0f0f 100%)" title="reputation" style="background:linear-gradient(135deg,#3a2a1f,#0f0f0f)"></div>
                    <div class="color-chip" data-bg="linear-gradient(135deg, #4a2a4a 0%, #6a3a6a 50%, #2a1a2a 100%)" title="Speak Now" style="background:linear-gradient(135deg,#4a2a4a,#2a1a2a)"></div>
                    <div class="color-chip" data-bg="linear-gradient(135deg, #4a4a1a 0%, #6a6a2a 50%, #2a2a0a 100%)" title="Fearless" style="background:linear-gradient(135deg,#4a4a1a,#2a2a0a)"></div>
                    <div class="color-chip" data-bg="linear-gradient(135deg, #3a1a3a 0%, #5a2a5a 50%, #e8a0bf 100%)" title="Lover" style="background:linear-gradient(135deg,#3a1a3a,#5a2a5a)"></div>
                </div>
            </div>
        </div>
        
        <button class="btn-generate" onclick="updateCard()">🎨 プレビュー更新</button>
        
        <div class="preview-area">
            <div class="lyric-card" id="card" style="background:linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)">
                <div class="content">
                    <p class="en-text" id="cardEn">"It's me, hi, I'm the problem, it's me"</p>
                    <p class="ja-text" id="cardJa">私よ、こんにちは、問題は私なの</p>
                </div>
                <div class="song-title" id="cardTitle">Anti-Hero — Taylor Swift</div>
                <div class="watermark">we-are-swifties.com</div>
            </div>
            
            <button class="btn-download" onclick="downloadCard()">📥 画像をダウンロード</button>
        </div>
    </div>

    <script>
        // Color chip selection
        document.querySelectorAll('.color-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.color-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('card').style.background = this.dataset.bg;
            });
        });
        
        function updateCard() {
            const en = document.getElementById('enLyrics').value;
            const ja = document.getElementById('jaLyrics').value;
            const title = document.getElementById('songTitle').value;
            
            document.getElementById('cardEn').textContent = '"' + en + '"';
            document.getElementById('cardJa').textContent = ja;
            document.getElementById('cardTitle').textContent = title;
            
            // Auto-adjust font size
            const enEl = document.getElementById('cardEn');
            if (en.length > 80) enEl.style.fontSize = '1.2rem';
            else if (en.length > 50) enEl.style.fontSize = '1.4rem';
            else enEl.style.fontSize = '1.6rem';
        }
        
        async function downloadCard() {
            const card = document.getElementById('card');
            // Use html2canvas
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            script.onload = async () => {
                const canvas = await html2canvas(card, {
                    scale: 2,
                    backgroundColor: null,
                    useCORS: true,
                    logging: false
                });
                const link = document.createElement('a');
                link.download = 'lyric-card.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            document.head.appendChild(script);
        }
    </script>
