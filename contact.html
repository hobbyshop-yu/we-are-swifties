    <style>
        :root {
            --bg-primary: #0c0806;
            --bg-secondary: #140e0a;
            --bg-card: #1a120d;
            --text-primary: #f5ebe0;
            --text-secondary: #b89e8a;
            --accent-gold: #d4a853;
            --accent-gold-light: #e8c779;
            --gradient-gold: linear-gradient(135deg, #c42b3b 0%, #d4a853 35%, #e8c779 65%, #f0d896 100%);
            --gradient-dark: linear-gradient(180deg, #0c0806 0%, #140e0a 50%, #1a120d 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            min-height: 100vh;
        }

        /* Global Nav */
        .global-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 1rem 1.5rem;
            background: rgba(12, 8, 6, 0.95);
            border-bottom: 1px solid rgba(212, 168, 83, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .global-nav a {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .global-nav a:hover { color: var(--accent-gold-light); }
        .global-nav a.nav-home {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            font-weight: 700;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0;
            text-transform: none;
        }

        @media (max-width: 600px) {
            .global-nav { gap: 1rem; flex-wrap: wrap; }
            .global-nav a { font-size: 0.65rem; }
        }

        /* Hero */
        .hero {
            position: relative;
            min-height: 20vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--gradient-dark);
            padding: 2rem 1rem;
        }

        .hero-content { position: relative; z-index: 1; padding: 2rem; }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 700;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
        }

        .hero-sub {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* Main content */
        .main-content {
            max-width: 780px;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
        }

        .main-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--accent-gold-light);
            margin: 2rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(212, 168, 83, 0.15);
        }

        .main-content h2:first-child { margin-top: 0; }

        .main-content p {
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 2;
        }

        .main-content ul, .main-content ol {
            margin: 0.5rem 0 1.5rem 1.5rem;
            font-size: 0.88rem;
            color: var(--text-primary);
        }

        .main-content li { margin-bottom: 0.5rem; line-height: 1.8; }

        .main-content a {
            color: var(--accent-gold-light);
            text-decoration: underline;
            text-decoration-color: rgba(232, 199, 121, 0.3);
        }

        .main-content a:hover { text-decoration-color: var(--accent-gold-light); }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid rgba(212, 168, 83, 0.1);
        }

        .footer .site-name {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .footer-links a {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }

        .footer-links a:hover { color: var(--accent-gold-light); }

        .footer .copyright {
            font-size: 0.7rem;
            color: #6a5040;
        }

        /* Google Form embed */
        .form-container {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1rem;
            margin: 1.5rem 0;
        }

        .form-container iframe {
            width: 100%;
            height: 800px;
            border: none;
            border-radius: 8px;
        }

        /* Profile card */
        .profile-card {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: var(--bg-card);
            border: 1px solid rgba(212, 168, 83, 0.12);
            border-radius: 14px;
            padding: 2rem;
            margin: 1.5rem 0;
        }

        .profile-icon {
            font-size: 3rem;
            flex-shrink: 0;
        }

        .profile-info h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: var(--accent-gold-light);
            margin-bottom: 0.3rem;
        }

        .profile-info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0;
        }

        @media (max-width: 600px) {
            .profile-card { flex-direction: column; text-align: center; }
            .main-content { padding: 2rem 1rem 3rem; }
        }
