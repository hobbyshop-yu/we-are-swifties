    <div class="container">
        <h1>🔍 歌詞検索</h1>
        <p class="subtitle">全曲の歌詞を英語・日本語で横断検索</p>
        <div class="search-box">
            <span class="search-icon">🔎</span>
            <input type="text" id="searchInput" placeholder="歌詞やフレーズを入力..." autofocus>
        </div>
        <div class="stats" id="stats"></div>

        <a href="index.html" class="back-link">← 曲一覧に戻る</a>
    </div>
    <script src="lyrics-data.js"></script>
    <script>
    const input = document.getElementById('searchInput');
    const resultsEl = document.getElementById('results');
    const statsEl = document.getElementById('stats');
    
    statsEl.textContent = `${SONGS_DATA.length}曲の歌詞から検索できます`;
    
    let debounceTimer;
    input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(doSearch, 200);
    });
    
    function doSearch() {
        const q = input.value.trim().toLowerCase();
        if (q.length < 2) {
            resultsEl.innerHTML = '';
            statsEl.textContent = `${SONGS_DATA.length}曲の歌詞から検索できます`;
            return;
        }
        
        const matches = [];
        for (const song of SONGS_DATA) {
            const titleMatch = song.title.toLowerCase().includes(q);
            const lyricsMatch = song.lyrics.toLowerCase().includes(q);
            if (titleMatch || lyricsMatch) {
                let snippet = '';
                if (lyricsMatch) {
                    const idx = song.lyrics.toLowerCase().indexOf(q);
                    const start = Math.max(0, idx - 30);
                    const end = Math.min(song.lyrics.length, idx + q.length + 30);
                    snippet = (start > 0 ? '...' : '') + song.lyrics.slice(start, end) + (end < song.lyrics.length ? '...' : '');
                } else {
                    snippet = song.en.slice(0,2).join(' / ');
                }
                matches.push({ ...song, snippet, titleMatch });
            }
        }
        
        // Sort: title matches first
        matches.sort((a, b) => (b.titleMatch ? 1 : 0) - (a.titleMatch ? 1 : 0));
        
        statsEl.textContent = `${matches.length}件ヒット`;
        
        if (matches.length === 0) {
            resultsEl.innerHTML = '<div class="no-results">該当する曲が見つかりませんでした</div>';
            return;
        }
        
        resultsEl.innerHTML = matches.slice(0, 20).map(m => {
            const highlighted = m.snippet.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '<mark>$&</mark>');
            return `<a class="result-item" href="${m.file}">
                <div class="result-title">${m.title}</div>
                <div class="result-album">${m.album}</div>
                <div class="result-match">${highlighted}</div>
            </a>`;
        }).join('');
    }
    </script>
