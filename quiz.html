        lyric: "And you call me up again just to break me like a promise"

let currentQ = 0;
let scores = {};

function startQuiz() {
    scores = {};
    currentQ = 0;
    showQuestion(0);
}

function showQuestion(idx) {
    const q = questions[idx];
    const pct = ((idx) / questions.length * 100);
    document.getElementById('progress').style.width = pct + '%';
    document.getElementById('progressText').textContent = `${idx + 1} / ${questions.length}`;
    
    let html = `<div class="question-card">
        <div class="question-emoji">${q.emoji}</div>
        <div class="question-text">${q.text}</div>
        <div class="options">`;
    
    q.options.forEach((opt, i) => {
        html += `<button class="option" onclick="selectOption(${idx}, ${i})">${opt.text}</button>`;
    });
    
    html += `</div></div>`;
    document.getElementById('quizArea').innerHTML = html;
}

function selectOption(qIdx, optIdx) {
    const opt = questions[qIdx].options[optIdx];
    for (const [album, score] of Object.entries(opt.scores)) {
        scores[album] = (scores[album] || 0) + score;
    }
    
    currentQ++;
    if (currentQ < questions.length) {
        showQuestion(currentQ);
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('progress').style.width = '100%';
    document.getElementById('progressText').textContent = '診断完了！';
    
    // Find top album
    let topAlbum = '';
    let topScore = 0;
    for (const [album, score] of Object.entries(scores)) {
        if (score > topScore) {
            topScore = score;
            topAlbum = album;
        }
    }
    
    const r = results[topAlbum] || results.midnights;
    const tweetText = encodeURIComponent(`🎵 テイラー・スウィフト楽曲診断の結果…\n\n私にぴったりの曲は「${r.title}」${r.emoji}\n\n「${r.lyric}」\n\nあなたも診断してみて👇`);
    const tweetUrl = encodeURIComponent('https://we-are-swifties.com/quiz.html');
    
    let html = `<div class="result-card">
        <div class="result-emoji">${r.emoji}</div>
        <h2>${r.title}</h2>
        <div class="result-album">${r.album}</div>
        <div class="result-desc">${r.desc}</div>
        <div class="result-lyric">"${r.lyric}"</div>

            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            結果をXでシェア
        </a><br>
        <button class="retry-btn" onclick="startQuiz()">🔄 もう一度診断する</button><br>
        <a href="${r.file}" class="retry-btn" style="margin-top:1rem">🎵 ${r.title}の歌詞・解説を見る</a>
    </div>`;
    
    document.getElementById('quizArea').innerHTML = html;
}
