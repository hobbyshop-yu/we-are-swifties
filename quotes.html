    <div class="container">
        <h1>✨ 名言・名歌詞集</h1>
        <p class="subtitle">テイラーの心に響くフレーズ — 日本語訳付き</p>
        <div class="album-filter" id="filter"></div>
        <div id="quotes"></div>
        <a href="index.html" class="back-link">← 曲一覧に戻る</a>
    </div>
<script>
const quotes = [
    {en:"It's me, hi, I'm the problem, it's me",ja:"私よ、こんにちは、問題は私なの",song:"Anti-Hero",album:"Midnights",file:"anti-hero.html"},
    {en:"Long story short, I survived",ja:"長い話を端折ると、私は生き延びた",song:"Long Story Short",album:"evermore",file:"long-story-short.html"},
    {en:"You belong with me",ja:"あなたの居場所は私のそばなのに",song:"You Belong with Me",album:"Fearless",file:"you-belong-with-me-tv.html"},
    {en:"We are never ever ever getting back together",ja:"私たちは絶対に絶対にヨリを戻さない",song:"We Are Never Ever Getting Back Together",album:"Red",file:"we-are-never-ever-getting-back-together-tv.html"},
    {en:"I remember it all too well",ja:"全部、痛いほど覚えてる",song:"All Too Well",album:"Red",file:"all-too-well-tv.html"},
    {en:"Darling, I'm a nightmare dressed like a daydream",ja:"ダーリン、私は白昼夢の衣をまとった悪夢",song:"Blank Space",album:"1989",file:"blank-space-tv.html"},
    {en:"Band-aids don't fix bullet holes",ja:"絆創膏じゃ銃弾の穴はふさげない",song:"Bad Blood",album:"1989",file:"bad-blood-tv.html"},
    {en:"When you are young they assume you know nothing",ja:"若いというだけで何も知らないと思われる",song:"cardigan",album:"folklore",file:"cardigan.html"},
    {en:"Don't blame me, love made me crazy",ja:"私を責めないで、愛が私を狂わせたの",song:"Don't Blame Me",album:"reputation",file:"dont-blame-me.html"},
    {en:"I love you, it's ruining my life",ja:"あなたを愛してる、それが人生を壊してる",song:"Fortnight",album:"TTPD",file:"fortnight.html"},
    {en:"She would've made such a lovely bride",ja:"彼女はきっと素敵な花嫁になれたのに",song:"champagne problems",album:"evermore",file:"champagne-problems.html"},
    {en:"Romeo, take me somewhere we can be alone",ja:"ロミオ、二人きりになれる場所へ連れて行って",song:"Love Story",album:"Fearless",file:"love-story-tv.html"},
    {en:"I knew you were trouble when you walked in",ja:"あなたが入ってきた瞬間、トラブルだと分かった",song:"I Knew You Were Trouble",album:"Red",file:"i-knew-you-were-trouble-tv.html"},
    {en:"Please don't be in love with someone else",ja:"お願い、誰かを好きにならないで",song:"Enchanted",album:"Speak Now",file:"enchanted-tv.html"},
    {en:"Cause the players gonna play, play, play",ja:"だってプレイヤーは遊び続けるだけ",song:"Shake It Off",album:"1989",file:"shake-it-off-tv.html"},
    {en:"You drew stars around my scars",ja:"あなたは私の傷跡の周りに星を描いてくれた",song:"cardigan",album:"folklore",file:"cardigan.html"},
    {en:"I'm like the water when your ship rolled in that night",ja:"あの夜あなたの船が着いた時の海のよう",song:"willow",album:"evermore",file:"willow.html"},
    {en:"Karma is my boyfriend",ja:"カルマは私のボーイフレンド",song:"Karma",album:"Midnights",file:"karma.html"},
    {en:"I've been the archer, I've been the prey",ja:"私は射手でもあり、獲物でもあった",song:"The Archer",album:"Lover",file:"the-archer.html"},
    {en:"You're on your own, kid, you always have been",ja:"一人なんだよ、ずっとそうだった",song:"You're on Your Own, Kid",album:"Midnights",file:"youre-on-your-own-kid.html"},
    {en:"I once believed love would be burning red",ja:"かつて愛は燃えるような赤だと信じていた",song:"Red",album:"Red",file:"red-tv.html"},
    {en:"He looks up grinning like a devil",ja:"彼は悪魔みたいにニヤリと笑って見上げる",song:"Cruel Summer",album:"Lover",file:"cruel-summer.html"},
    {en:"In my defense, I have none",ja:"弁明できることは、何もない",song:"Anti-Hero",album:"Midnights",file:"anti-hero.html"},
    {en:"I think I've seen this film before, and I didn't like the ending",ja:"この映画は前にも見た気がする、結末は好きじゃなかった",song:"exile",album:"folklore",file:"exile.html"},
    {en:"Is it cool that I said all that?",ja:"あんなこと全部言っちゃってよかった？",song:"Delicate",album:"reputation",file:"delicate.html"},
    {en:"I don't wanna look at anything else now that I saw you",ja:"あなたを見てしまったから、もう他のものは見たくない",song:"Daylight",album:"Lover",file:"daylight.html"},
    {en:"And you call me up again just to break me like a promise",ja:"あなたはまた電話をくれる、約束のように私を壊すために",song:"All Too Well",album:"Red",file:"all-too-well-tv.html"},
    {en:"I had the time of my life fighting dragons with you",ja:"あなたとドラゴンと戦った人生最高の時間",song:"Long Live",album:"Speak Now",file:"long-live-tv.html"},
    {en:"We were both young when I first saw you",ja:"初めて会った時、私たちはまだ若かった",song:"Love Story",album:"Fearless",file:"love-story-tv.html"},
    {en:"My tears ricochet",ja:"私の涙が跳ね返る",song:"my tears ricochet",album:"folklore",file:"my-tears-ricochet.html"},
];

const albumNames = [...new Set(quotes.map(q => q.album))];
let activeAlbum = '';

// Render filter
const filterEl = document.getElementById('filter');
filterEl.innerHTML = `<div class="filter-chip active" onclick="filterAlbum('')">全て</div>` +
    albumNames.map(a => `<div class="filter-chip" onclick="filterAlbum('${a}')">${a}</div>`).join('');

function filterAlbum(album) {
    activeAlbum = album;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    render();
}

function render() {
    const filtered = activeAlbum ? quotes.filter(q => q.album === activeAlbum) : quotes;
    document.getElementById('quotes').innerHTML = filtered.map(q => {
        const shareText = encodeURIComponent(`✨「${q.en}」\n（${q.ja}）\n\n— ${q.song}, Taylor Swift\n\n#TaylorSwift #テイラースウィフト`);
        const shareUrl = encodeURIComponent(`https://we-are-swifties.com/${q.file}`);
        return `<div class="quote-card">
            <div class="quote-en">"${q.en}"</div>
            <div class="quote-ja">${q.ja}</div>
            <div class="quote-meta">
                <span class="quote-song"><a href="${q.file}">${q.song}</a> — ${q.album}</span>
                <a class="quote-share" href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener">シェア</a>
            </div>
        </div>`;
    }).join('');
}

render();
</script>
